# 回滚服务端：Actions → 「回滚服务端」→ Run workflow。tag 留空 = 回到上一个成功上线的版本。不受发布窗口限制，秒级。
name: 回滚服务端
# 运行名带上参数：GitHub 不记录手动触发时填的值，内网门户的流水线页和 Actions 列表靠它显示版本与方式
run-name: "回滚服务端 → ${{ inputs.tag || '上一个成功上线的版本' }}"
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 回到哪个版本（如 server-v0.1.1；留空 = 上一个成功上线的版本）
        type: string
        default: ""
jobs:
  rollback:
    permissions: { contents: read, deployments: write }
    uses: imelonkid/melon-ci/.github/workflows/server-rollback.yml@v1
    with:
      service: __NAME__
      tag: ${{ inputs.tag }}
    secrets: inherit
