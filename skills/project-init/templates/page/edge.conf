# 静态宣传页的反代模板（项目基线「静态宣传页」）：节点的反代直接出静态文件，没有容器。
# 复制到运维仓库 network/edge/<节点>/<域名>.conf，替换 __DOMAIN__、证书路径与站点根目录（<站点目录>/current），用该目录的 deploy.sh 下发。
# 内容由部署入口（TYPE=page）放在 <站点目录>/releases/<tag>/，current 软链接指向线上那一版；这里只认 current

server {
    listen 80;
    server_name __DOMAIN__;
    server_tokens off;
    location ^~ /.well-known/acme-challenge {
        allow all;
        root /usr/share/nginx/html;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name __DOMAIN__;
    server_tokens off;
    ssl_certificate <证书目录>/fullchain.pem;
    ssl_certificate_key <证书目录>/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=31536000" always;

    root <站点目录>/current;
    index index.html;
    disable_symlinks off;                          # current 是软链接（切版本用）；内容本身不许有链接，部署入口已拦
    charset utf-8;

    location = /index.html {                       # 页面本身不缓存：改版立即生效
        add_header Cache-Control "no-cache";
        add_header Strict-Transport-Security "max-age=31536000" always;
    }
    location /assets/ {                            # 图片等长缓存（改了就换文件名）
        expires 30d;
        add_header Cache-Control "public";
        add_header Strict-Transport-Security "max-age=31536000" always;
    }
    location / {
        try_files $uri $uri/ =404;
    }
}
